# Replace the domain and certificate paths before deployment.
# Bind Next.js and NestJS to loopback; do not expose their HTTP ports externally.
upstream qlhv_web { server 127.0.0.1:3000; keepalive 64; }
upstream qlhv_api { server 127.0.0.1:3001; keepalive 128; }
server {
    listen 80;
    server_name admissions.example.edu.vn;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name admissions.example.edu.vn;
    ssl_certificate /etc/qlhv/tls/fullchain.pem;
    ssl_certificate_key /etc/qlhv/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:QLHV:20m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 11m;
    location /api/ {
        proxy_pass http://qlhv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
    location / {
        proxy_pass http://qlhv_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
